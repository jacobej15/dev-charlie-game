<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewport & Shake Demo</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #f4f4f9; }
        .card { background: white; padding: 20px; margin: 15px auto; border-radius: 8px; max-width: 500px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #shakeBox { font-size: 1.5em; font-weight: bold; padding: 30px; background: #e2e8f0; border-radius: 8px; transition: background 0.3s; }
    </style>
</head>
<body>

    <h1>Viewport & Shake Demo</h1>

    <div class="card">
        <h2>1. Viewport (Browser/Visitor)</h2>
        <p id="viewportInfo">Measuring...</p>
    </div>

    <div class="card">
        <h2>2. Shake Phone (Mobile Input)</h2>
        <div id="shakeBox">Shake your phone!</div>
    </div>

    <div class="card">
        <h2>3. Research Quick Notes</h2>
        <p><strong>What it is:</strong> Window dimensions via JS and DeviceMotion event acceleration.</p>
        <p><strong>When to use:</strong> Responsive layouts or gesture-based triggers.</p>
    </div>

    <script>
        // --- TOPIC 1: VIEWPORT ---
        const width = window.innerWidth;
        const height = window.innerHeight;
        const viewportText = `Width: ${width}px, Height: ${height}px`;
        document.getElementById('viewportInfo').innerText = viewportText;
        console.log("Viewport Data ->", viewportText);

        // --- TOPIC 2: SHAKE PHONE ---
        let lastX = 0, lastY = 0, lastZ = 0;
        const shakeThreshold = 15;
        let shakeCount = 0;

        window.addEventListener('devicemotion', (event) => {
            let acc = event.accelerationIncludingGravity;
            if (!acc) return;

            let deltaX = Math.abs(acc.x - lastX);
            let deltaY = Math.abs(acc.y - lastY);
            let deltaZ = Math.abs(acc.z - lastZ);

            if ((deltaX + deltaY + deltaZ) > shakeThreshold) {
                shakeCount++;
                document.getElementById('shakeBox').innerText = `Shaken! Count: ${shakeCount}`;
                document.getElementById('shakeBox').style.background = '#48bb78';
                document.getElementById('shakeBox').style.color = 'white';
                console.log("Shake detected! Total shakes:", shakeCount);
            }

            lastX = acc.x;
            lastY = acc.y;
            lastZ = acc.z;
        });

        // --- TOPIC 3: SESSION STORAGE REQUIREMENT ---
        const visitor = {
            name: "Brandon Harwell", 
            viewport: viewportText
        };
        sessionStorage.setItem('visitor', JSON.stringify(visitor));

        const teams = JSON.parse(sessionStorage.getItem('teams')) || [];
        teams.push({
            name1: 'Brandon',
            name2: 'Teammate', 
            page: 'brandon_harwell_viewport-shake.html'
        });
        sessionStorage.setItem('teams', JSON.stringify(teams));
        
        console.log("Session Storage Updated:", sessionStorage.getItem('teams'));
    </script>
</body>
</html>
