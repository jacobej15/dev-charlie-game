<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen & Drag</title>
  </head>
  <body>
    <p id="Screen"></p>

    <div id="drag-item" draggable="true">Drag Me</div>

    <script>
      console.log("Screen width: " + screen.width);
      console.log("Screen height: " + screen.height);
      console.log("Device pixel ratio: " + window.devicePixelRatio);

      const screenDisplay = document.getElementById("Screen");

      function updateScreenSize() {
        screenDisplay.innerHTML =
          "Screen size: " +
          screen.width +
          " × " +
          screen.height +
          "<br>Device pixel ratio: " +
          window.devicePixelRatio;
      }

      updateScreenSize();
      window.addEventListener("resize", updateScreenSize);

      const visitor = {
        name: nameVariable,
        viewport: viewportVariable,
        //...whichever data you are storing
      };
      sessionStorage.setItem("visitor", JSON.stringify(visitor));

      // get existing array OR start a new one
      const teams = JSON.parse(sessionStorage.getItem("teams")) || [];

      // add this team
      teams.push({
        name1: "Camdyn Mardis",
        name2: "Tony Aleman",
        page: "Screen-Drag.html",
      });

      // save the updated array
      sessionStorage.setItem("teams", JSON.stringify(teams));
    </script>
  </body>
</html>
